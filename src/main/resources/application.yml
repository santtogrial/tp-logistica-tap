spring:
  application:
    name: logistica-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logistica}
    username: ${DB_USER:logistica}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
  jackson:
    time-zone: America/Argentina/Buenos_Aires
  web:
    locale: es_AR
    locale-resolver: fixed

server:
  port: 8080

logistica:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:480}
  optimizador:
    velocidad-kmh: 25
    minutos-por-parada: 5
  cors:
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:3000,http://localhost:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    ar.edu.up.tap.logistica: INFO
